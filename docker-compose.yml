services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: rag
      POSTGRES_DB: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    ports: ["5433:5432"]   # 5433 so it can run next to payflow-sim's PostgreSQL
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 2s
      retries: 30
    mem_limit: 512m
volumes:
  pgdata:
