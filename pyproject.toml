[project]
name = "runbook-rag"
version = "0.1.0"
description = "Runbook assistant: hybrid retrieval over redacted runbooks, with an evaluation suite"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastembed>=0.9",
  "psycopg[binary]>=3.3",
  "pgvector>=0.5",
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  "pyyaml>=6",
  "typer>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
anthropic = ["anthropic>=2.13"]
mcp = ["mcp>=2.3,<3"]

[project.scripts]
rag = "rag.cli:app"
rag-mcp = "rag.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
